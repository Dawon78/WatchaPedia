<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::section})">
      
<section>
    <link rel="stylesheet" th:href="@{/member/following.css}">
    
    <div class="u-mod-friend-page-container">
        <div class="u-mod-friend-content">
            <div class="u-mod-friend-head">
                <h2 class="u-mod-friend-page-title">팔로잉</h2>
            </div>

            <div class="u-mod-friend-body">
                
                <div th:if="${#lists.isEmpty(followingList)}" class="u-mod-friend-empty" style="text-align:center; padding: 100px 0;">
                    <p style="color: #8e8e93; font-size: 15px;">팔로잉 중인 친구가 아직 없어요.</p>
                </div>

                <div th:unless="${#lists.isEmpty(followingList)}" 
                     class="u-mod-friend-item" th:each="friend : ${followingList}">
                    
                    <div class="u-mod-friend-profile">
                        <img th:src="${friend.memberPhoto ?: '/images/default-profile.png'}" alt="프로필">
                    </div>
                    
                    <div class="u-mod-friend-info">
                        <div class="u-mod-friend-name">
                            <span th:text="${friend.memberName ?: friend.memberId}">사용자 이름</span> 
                            <span class="u-mod-friend-badge" th:if="${friend.memberId == 'admin'}">✔</span>
                        </div>
                        <p class="u-mod-friend-meta" th:text="${friend.memberBio ?: friend.memberId}">소개글</p>
                    </div>
                    
                    <button class="u-mod-friend-follow-btn following" 
                            th:data-id="${friend.memberId}"
                            onclick="toggleUniqueFollow(this.getAttribute('data-id'), this)">
                        팔로잉
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/login/findFriends.js}"></script>
</section>
</html>
