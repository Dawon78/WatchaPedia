<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::section})">

<section>
    <link rel="stylesheet" th:href="@{/member/ratingreviewdetail.css}">

<div class="content-container">
    <header class="detail-header">
        <a href="javascript:history.back()" class="back-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 18L9 12L15 6" stroke="#FF0558" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
        <h1 class="page-header-title">평가한 영화</h1>
    </header>

    <div class="rating-summary-bar">
        <h2 class="summary-text">
            <span th:text="${#numbers.formatDecimal(selectedRating, 1, 1)}">3.0</span>점 준 영화
            <span class="count-highlight" th:text="${ratingCount}">0</span>
        </h2>
    </div>

    <div class="work-grid">
        <div class="work-item" th:each="rating : ${movieList}">
            <div class="poster-wrapper">
                <img th:src="@{'/images/' + ${rating.work.workThumbnail}}" alt="poster">
            </div>
            <div class="work-title" th:text="${rating.work.workTitle}">작품명</div>
        </div>

        <div th:if="${#lists.isEmpty(movieList)}" style="width: 100%; text-align: center; padding: 100px 0; color: #8c8c8c;">
            평가한 작품이 없습니다.
        </div>
    </div>
</div>
</section>
</html>
