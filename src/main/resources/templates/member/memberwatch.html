<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::section})">
      
<section>
<style>
    body { margin: 0; padding-top: 32px; background: #ffffff; font-family: Arial, sans-serif; }
    .storage-watch-container { max-width: 1270px; margin: 40px auto 80px; padding: 0 20px; }
    .storage-watch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .storage-watch-title { font-size: 26px; font-weight: bold; }
    .storage-sort-select { width: 160px; height: 40px; padding: 0 10px; border-radius: 6px; border: 1px solid #ddd; background: #fff; font-size: 14px; cursor: pointer; }
    .storage-watch-list { display: flex; gap: 30px; flex-wrap: wrap; }
    .storage-watch-card { width: 160px; }
    .storage-watch-card img { width: 160px; height: 230px; border-radius: 6px; object-fit: cover; }
    .storage-watch-title-text { margin-top: 10px; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .storage-watch-rating { margin-top: 5px; font-size: 13px; color: #ff9f00; }
    .storage-empty { text-align: center; margin-top: 120px; color: #999; }
    .storage-empty-icon { font-size: 60px; margin-bottom: 20px; }
    .storage-empty-text { font-size: 15px; }
</style>

<div class="storage-watch-container">

    <div class="storage-watch-header">
        <div class="storage-watch-title">
            <th:block th:switch="${type.name()}">
                <span th:case="'MOVIE'">보고싶어요한 영화</span>
                <span th:case="'WEBTOON'">보고싶어요한 웹툰</span>
                <span th:case="'SERIES'">보고싶어요한 시리즈</span>
                <span th:case="'BOOK'">보고싶어요한 책</span>
                <span th:case="*">보고싶어요한 작품</span>
            </th:block>
        </div>

        <select class="storage-sort-select">
            <option>담은 순</option>
            <option>이름 순</option>
            <option>평점 순</option>
        </select>
    </div>

<div class="storage-watch-list" th:if="${watchList != null and !watchList.isEmpty()}">
    <div class="storage-watch-card" th:each="storage : ${watchList}">
        <a th:href="@{/work/{id}(id=${storage.work.workId})}" style="text-decoration: none; color: inherit;">
            <img th:src="@{'/images/' + ${storage.work.workThumbnail}}" 
                 th:alt="${storage.work.workTitle}">
            
            <div class="storage-watch-title-text" th:text="${storage.work.workTitle}">작품 제목</div>
            
            <div class="storage-watch-rating">
                평균 ★ <span th:text="${storage.work.avgRating != null ? #numbers.formatDecimal(storage.work.avgRating, 1, 1) : '0.0'}">0.0</span>
            </div>
        </a>
    </div>
</div>
            </a>
        </div>
    </div>

    <div th:if="${watchList == null or watchList.isEmpty()}" class="storage-empty">
        <div class="storage-empty-icon">
            <span th:text="${type.name() == 'MOVIE' ? '🎬' : '📂'}">📂</span>
        </div>
        <div class="storage-empty-text">
            보고싶어요 하신 작품이 없어요.
        </div>
    </div>

</div>
</section>
</html>
