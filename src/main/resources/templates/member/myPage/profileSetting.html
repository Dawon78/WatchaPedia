<div th:fragment="profileSettingFragment">
	<style>
		.u-settings-window {
            background: #fff; width: 400px; height: 650px; border-radius: 16px; 
            overflow: hidden; display: flex; flex-direction: column; position: relative;
        }

        /* 💡 본문 영역 스크롤 설정 */
        .u-settings-body { 
            flex: 1; 
            overflow-y: auto; 
            padding: 0 20px 30px; 
        }
        
        /* 스크롤바 디자인 */
        .u-settings-body::-webkit-scrollbar { width: 6px; }
        .u-settings-body::-webkit-scrollbar-thumb { background: #e3e3e3; border-radius: 10px; }

        /* 💡 헤더 구성: X 버튼 아래에 '설정' 글자 배치 */
        .u-mod-settings-head {
            padding: 15px 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border-bottom: 1px solid #f0f0f0;
        }

        .u-mod-close-x {
            background: none; border: none; font-size: 24px; color: #ff0558; 
            cursor: pointer; padding: 0; margin-bottom: 10px;
        }

        .u-mod-title-left { 
        	padding-top:30px;
            font-size: 20px; font-weight: bold; color: #000; margin: 0; 
        }

        /* 섹션 및 구분선(hr) */
        .u-settings-section { margin-top: 20px; }
        .u-settings-label { font-size: 14px; color: #8e8e93; margin: 25px 0 10px; font-weight: 500; }
        
        .u-settings-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; cursor: pointer; }
        .u-settings-row span { font-size: 16px; color: #292a32; }
        
        /* 💡 항목 사이의 구분선 스타일 */
        .u-settings-hr { border: 0; border-top: 1px solid #f0f0f0; margin: 0; }

        /* 토글 버튼 */
        .u-toggle { position: relative; width: 46px; height: 26px; background: #e3e3e3; border-radius: 13px; transition: .3s; }
        .u-toggle.active { background: #ff0558; }
        .u-toggle::after { 
            content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; 
            background: #fff; border-radius: 50%; transition: .3s;
        }
        .u-toggle.active::after { left: 22px; }
        
        .u-settings-val { font-size: 14px; color: #a5a5a7; }
        .u-settings-row.danger span { color: #8e8e93; font-size: 14px; }
	</style>
<!-- 프로필 설정  -->
