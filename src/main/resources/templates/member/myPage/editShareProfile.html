<div th:fragment="editShareFragment">
	<style>
	
	.u-mod-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.5); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
}

/* 프로필 수정 윈도우 */
.u-mod-window {
    background: #fff; width: 375px; border-radius: 16px; overflow: hidden; position: relative;
}

.u-mod-head {
    height: 52px; border-bottom: 1px solid #f0f0f0;
    display: flex; align-items: center; justify-content: center;
}

.u-mod-close-x {
    position: absolute; left: 16px; background: none; border: none;
    font-size: 22px; color: #ff0558; cursor: pointer;
}

.u-mod-title { font-size: 16px; font-weight: bold; margin: 0; }

/* 💡 사진 수정 영역 (핑크 큐브 패턴 재현) */
.u-mod-visual-edit { position: relative; height: 180px; margin-bottom: 35px; }

.u-mod-bg-pattern {
    height: 130px; background-color: #f8b3c9;
    background-image: linear-gradient(30deg, #f09cb8 12%, transparent 12.5%, transparent 87%, #f09cb8 87.5%, #f09cb8),
                      linear-gradient(150deg, #f09cb8 12%, transparent 12.5%, transparent 87%, #f09cb8 87.5%, #f09cb8);
    background-size: 40px 70px;
    display: flex; align-items: center; justify-content: center;
}

.u-mod-circle {
    position: absolute; bottom: -30px; left: 20px;
    width: 90px; height: 90px; border-radius: 50%; border: 3px solid #fff;
    background: #eee; overflow: hidden;
}

.u-mod-circle img { width: 100%; height: 100%; object-fit: cover; }

.u-mod-cam-icon {
    position: absolute; width: 32px; height: 32px; border-radius: 50%;
    background: #fff; border: 1px solid #ddd; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}

.profile-cam { top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.2); color: #fff; border: none; }

/* 폼 스타일 */
.u-mod-form { padding: 0 20px 20px; }
.u-mod-input-group { position: relative; margin-bottom: 20px; border-bottom: 1px solid #eee; }
.u-mod-input-group label { display: block; font-size: 12px; color: #8e8e93; margin-bottom: 4px; }
.u-mod-input-group input, .u-mod-input-group textarea {
    width: 100%; border: none; outline: none; padding: 6px 0; font-size: 15px; background: transparent;
}
.u-mod-counter { text-align: right; font-size: 11px; color: #ccc; padding-bottom: 4px; }
.u-mod-btn-submit {
    width: 100%; padding: 14px; background: #f2f2f2; color: #a5a5a7;
    border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
}

/* 💡 알림 모달 스타일 (image_ce3174 참고) */
.u-mod-alert-box { background: #fff; width: 300px; border-radius: 12px; overflow: hidden; text-align: center; }
.u-mod-alert-content { padding: 30px 20px; }
.u-mod-alert-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
.u-mod-alert-msg { font-size: 14px; color: #292a32; }
.u-mod-alert-confirm {
    width: 100%; padding: 15px 0; background: #fff; border: none; border-top: 1px solid #f0f0f0;
    color: #ff0558; font-weight: bold; font-size: 15px; cursor: pointer;
}
	
	</style>
<!-- 프로필 수정, 공유  -->
	<div id="uModEditLayer" class="u-mod-overlay" style="display: none;">
		<div class="u-mod-window">
			<div class="u-mod-head">
				<button class="u-mod-close-x" onclick="toggleUniqueEditModal(false)">✕</button>
				<h2 class="u-mod-title">프로필 수정</h2>
			</div>
			<div class="u-mod-body">
				<div class="u-mod-visual-edit">
					<div class="u-mod-bg-pattern">
						<button class="u-mod-cam-icon bg-cam">📷</button>
					</div>
					<div class="u-mod-profile-box">
						<div class="u-mod-circle">
							<img
								th:src="${member?.memberPhoto != null ? member.memberPhoto : '/images/default-profile.png'}"
								src="/images/default-profile.png" alt="프로필">
							<button class="u-mod-cam-icon profile-cam">📷</button>
						</div>
					</div>
				</div>
				<form class="u-mod-form">
					<div class="u-mod-input-group">
						<label>이름</label> <input type="text"
							th:value="${member?.memberName ?: 'grg'}" maxlength="20">
						<div class="u-mod-counter">3/20</div>
					</div>
					<div class="u-mod-input-group">
						<label>소개</label>
						<textarea placeholder="소개를 입력해주세요." maxlength="60"></textarea>
						<div class="u-mod-counter">0/60</div>
					</div>
					<div class="u-mod-input-group">
						<label>URL</label> <input type="text"
							placeholder="공유하고 싶은 URL을 입력해주세요." maxlength="300">
						<div class="u-mod-counter">0/300</div>
					</div>
					<button type="submit" class="u-mod-btn-submit">확인</button>
				</form>
			</div>
		</div>
	</div>
	
	<div id="uModAlertLayer" class="u-mod-overlay u-mod-alert-type"
		style="display: none;">
		<div class="u-mod-alert-box">
			<div class="u-mod-alert-content">
				<h3 class="u-mod-alert-title">알림</h3>
				<p class="u-mod-alert-msg">프로필 링크가 복사됐습니다</p>
			</div>
			<button class="u-mod-alert-confirm"
				onclick="toggleUniqueAlertModal(false)">확인</button>
		</div>
	</div>
	
</div>>
