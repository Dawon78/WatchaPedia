<div th:fragment="noticeFragment">
<style>

/* ===== 고객센터 모달 ===== */
.u-mod-notice-window {
    background: #fff;
    width: 500px;
    max-height: 600px;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.u-mod-notice-head {
    height: 52px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.u-mod-notice-close {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 22px;
    color: #ff0558;
    cursor: pointer;
}

.u-mod-notice-title {
    font-size: 16px;
    font-weight: bold;
}

.u-mod-notice-body {
    flex: 1;
    overflow-y: auto;
}

/* ===== 문의 아이템 ===== */
.u-mod-notice-item {
    border-bottom: 1px solid #f1f1f1;
    padding: 15px 20px;
    cursor: pointer;
}

.u-mod-notice-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.u-mod-notice-subject {
    font-size: 14px;
    font-weight: bold;
}

.u-mod-notice-date {
    font-size: 12px;
    color: #8e8e93;
    margin-top: 3px;
}

.u-mod-notice-arrow {
    font-size: 14px;
    color: #999;
}

.u-mod-notice-content {
    display: none;
    font-size: 13px;
    color: #555;
    margin-top: 12px;
    line-height: 1.6;
}

.u-mod-notice-item.active .u-mod-notice-content {
    display: block;
}
.u-mod-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

</style>

            <button class="u-mod-notice-close" onclick="toggleMypageNotice(false)">✕</button>
            <h2 class="u-mod-notice-title">문의 내역</h2>
        </div>

        <div class="u-mod-notice-body">

            <!-- 문의 1 -->
            <div class="u-mod-notice-item" onclick="toggleNoticeItem(this)">
                <div class="u-mod-notice-top">
                    <div>

                        <div class="u-mod-notice-date">2026.02.26</div>
                    </div>
                    <div class="u-mod-notice-arrow">▼</div>
                </div>

                <div class="u-mod-notice-content">
                    비밀번호를 여러 번 입력했지만 로그인이 되지 않습니다.
                    해결 방법 안내 부탁드립니다.
                </div>
            </div>

            <!-- 문의 2 -->

                    <div>
                        <div class="u-mod-notice-subject">결제 오류 문의</div>
                        <div class="u-mod-notice-date">2026.02.20</div>
                    </div>
                    <div class="u-mod-notice-arrow">▼</div>
                </div>

                <div class="u-mod-notice-content">
                    결제 진행 중 오류가 발생했습니다.
                    카드 결제가 정상적으로 처리되지 않았습니다.
                </div>
            </div>

        </div>

    </div>
</div>
