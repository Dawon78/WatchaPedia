<div th:fragment="watchaJoinModal">

<style>
.modal-overlay {
	display: none; /* 초기 숨김 */
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: rgba(0, 0, 0, 0.5); /* 반투명 배경 */
	justify-content: center;
	align-items: center;
	z-index: 2000;
}

.modal-content {
	background: #fff;
	width: 330px;
	padding: 30px 20px;
	border-radius: 20px;
	text-align: center;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.modal-logo {
	font-size: 22px;
	font-weight: 900;
	margin-bottom: 25px;
}

.modal-title {
	font-size: 17px;
	font-weight: bold;
	margin-bottom: 25px;
}

.modal-input {
	width: 100%;
	height: 44px;
	background: #f5f5f5;
	border: none;
	border-radius: 7px;
	padding: 0 5px;
	margin-bottom: 8px;
	box-sizing: border-box;
}

.signup-btn {
	width: 100%;
	height: 44px;
	background: #ff0558;
	color: #fff;
	border: none;
	border-radius: 4px;
	font-weight: bold;
	margin-top: 15px;
	cursor: pointer;
}

.modal-footer-text {
	font-size: 13px;
	color: #8e8e93;
	margin: 15px 0;
}

.divider {
	display: flex;
	align-items: center;
	color: #d1d1d2;
	margin: 20px 0;
}

.divider::before, .divider::after {
	content: "";
	flex: 1;
	height: 1px;
	background: #eee;
	margin: 0 10px;
}

.social-group {
	display: flex;
	justify-content: center;
	gap: 15px;
}

.social-icon {
	width: 42px;
	height: 42px;
	border-radius: 50%;
	border: 1px solid #eee;
	display: flex;
	justify-content: center;
	align-items: center;
	cursor: pointer;
}
</style>

<div id="joinModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-logo">
                <span style="color: #ff0558;">WATCHA</span><span> PEDIA</span>
            </div>
            <div class="modal-title">회원가입</div>
            
            <form th:action="@{/member/join}" method="post">
                <input type="text" name="memberName" class="modal-input" placeholder="이름" required> 
                <input type="email" name="memberId" class="modal-input" placeholder="이메일" required> 
                
                <input type="password" name="memberPw" class="modal-input" placeholder="비밀번호" required>
        
                <button type="submit" class="signup-btn">회원가입</button>
            </form>

            <div class="modal-footer-text">
                이미 가입하셨나요? 
                <a href="javascript:void(0);" id="switchToLogin" style="color: #ff0558; text-decoration: none;">로그인</a>
            </div>
            <div class="divider">OR</div>
            <div class="social-group">
                <div class="social-icon" style="background: #fee500; border: none;">💬</div>
                <div class="social-icon">G</div>
                <div class="social-icon" style="background: #000; color: #fff;">X</div>
                <div class="social-icon" style="background: #000; color: #fff;">🍎</div>
                <div class="social-icon" style="background: #03c75a; border: none; color: #fff;">N</div>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const joinModal = document.getElementById('joinModal');
    const loginModal = document.getElementById('loginModal'); // 로그인 모달 ID가 'loginModal'이라고 가정
    const signUpBtn = document.getElementById('signUpBtn');
    const switchToLogin = document.getElementById('switchToLogin');

    // 회원가입 버튼 클릭 시 모달 열기
    if(signUpBtn) {
        signUpBtn.onclick = function() {
            joinModal.style.display = 'flex';
        };
    }

    // "이미 가입하셨나요? 로그인" 클릭 시 모달 교체
    if(switchToLogin) {
        switchToLogin.onclick = function() {
            joinModal.style.display = 'none';
            if(loginModal) loginModal.style.display = 'flex';
        };
    }

    // 모달 바깥 영역 클릭 시 닫기
    window.onclick = function(event) {
        if (event.target == joinModal) {
            joinModal.style.display = 'none';
        }
        // 로그인 모달 닫기도 여기에 포함되어야 함
        if (event.target == loginModal) {
            loginModal.style.display = 'none';
        }
    };
});
</script>
