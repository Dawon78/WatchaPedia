<div th:fragment="loginModal">

<style>
/* 회원가입 모달과 동일한 오버레이 스타일 */
.login-modal-overlay {
    display: none; /* 초기 숨김 */
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5); /* 반투명 배경 */
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

/* 회원가입 모달과 동일한 컨텐트 박스 스타일 */
.login-modal-content {
    background: #fff;
    width: 330px;
    padding: 30px 20px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.login-logo {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 25px;
}

.login-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 25px;
}

/* 회원가입과 통일된 인풋 스타일 */
.login-input {
    width: 100%;
    height: 44px;
    background: #f5f5f7;
    border: none;
    border-radius: 7px;
    padding: 0 15px;
    margin-bottom: 8px;
    font-size: 14px;
    box-sizing: border-box;
}

/* 회원가입과 통일된 버튼 스타일 */
.login-submit-btn {
    width: 100%;
    height: 44px;
    background: #ff0558;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
}

.login-footer-text {
    font-size: 13px;
    color: #8e8e93;
    margin: 15px 0;
}

/* 구분선 스타일 */
.login-divider {
    display: flex;
    align-items: center;
    color: #d1d1d2;
    font-size: 12px;
    margin: 20px 0;
}

.login-divider::before, .login-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #eee;
    margin: 0 10px;
}

/* 소셜 그룹 스타일 */
.social-group {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.social-icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.login-tip {
    margin-top: 20px;
    padding: 12px;
    background: #f5f5f7;
    border-radius: 8px;
    font-size: 11px;
    color: #8e8e93;
    line-height: 1.4;
}
</style>

<div th:fragment="loginModal">
    <div id="loginModal" class="login-modal-overlay" style="display: none;">
        <div class="login-modal-content">
            <div class="login-logo">
                <span style="color: #ff0558;">WATCHA</span><span> PEDIA</span>
            </div>
            
            <div class="login-title">로그인</div>
            
<form th:action="@{/login}" method="post">
    <input type="email" name="username" class="login-input" placeholder="이메일" required>
    <input type="password" name="password" class="login-input" placeholder="비밀번호" required>
    <button type="submit" class="login-submit-btn">로그인</button>
</form>
            
            <div class="login-footer-text">
                <a href="#" style="color: #ff0558; text-decoration: none; display: block; margin-bottom: 5px;">비밀번호를 잊어버리셨나요?</a>
                계정이 없으신가요? <span id="openSignUpFromLogin" style="color: #ff0558; cursor: pointer;">회원가입</span>
            </div>
            
            <div class="login-divider">OR</div>
            
            <div class="social-group">
                <div class="social-icon" style="background: #fee500; border: none;">💬</div>
                <div class="social-icon">G</div>
                <div class="social-icon" style="background: #000; color: #fff;">X</div>
                <div class="social-icon" style="background: #000; color: #fff;">🍎</div>
                <div class="social-icon" style="background: #03c75a; border: none; color: #fff;">N</div>
            </div>

            <div class="login-tip">
                TIP. 왓챠 계정이 있으신가요? 왓챠와 왓챠피디아는 같은 계정을 사용해요.
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            alert("아이디 또는 비밀번호가 일치하지 않습니다.");
            // 에러가 있을 때 로그인 모달을 자동으로 다시 띄워주면 좋습니다.
            document.getElementById('loginModal').style.display = 'flex';
        }
    }
    /*]]>*/
</script>
