<!-- 슬라이더 -->
<script>
document.addEventListener("DOMContentLoaded", function () {

	  document.querySelectorAll(".ranking-section").forEach(section => {

	    const scrollDiv = section.querySelector(".ranking-list");
	    const rightBtn  = section.querySelector(".slider-right");
	    const leftBtn   = section.querySelector(".slider-left button");
	    const card      = section.querySelector(".ranking-item");

	    if (!scrollDiv || !rightBtn || !leftBtn || !card) return;

	    const gap = 16;
	    const unit = card.offsetWidth + gap;

	    function updateButtons() {
	      const maxScroll = scrollDiv.scrollWidth - scrollDiv.clientWidth;

	      leftBtn.parentElement.style.display =
	        scrollDiv.scrollLeft <= 0 ? "none" : "block";

	      rightBtn.style.display =
	        scrollDiv.scrollLeft >= maxScroll - 1 ? "none" : "block";
	    }

	    rightBtn.addEventListener("click", () => {
	      scrollDiv.scrollBy({ left: unit, behavior: "smooth" });
	    });

	    leftBtn.addEventListener("click", () => {
	      scrollDiv.scrollBy({ left: -unit, behavior: "smooth" });
	    });

	    scrollDiv.addEventListener("scroll", updateButtons);
	    updateButtons();
	  });

	});
</script>
</section>
