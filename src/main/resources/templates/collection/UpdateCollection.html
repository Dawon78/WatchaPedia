<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="collectionModal">
    <style>
        /* 💡 !important를 사용하여 다른 CSS 간섭을 완전히 차단 */
        .collection_modal-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: rgba(0, 0, 0, 0.5) !important;
            z-index: 10000 !important; /* 최상단 유지 */
            display: none; /* 기본 숨김 */
            align-items: center;
            justify-content: center;
        }
        .collection_modal-content {
            background: #fff; width: 375px; height: 500px;
            border-radius: 16px; display: flex; flex-direction: column; 
            overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .collection_modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; border-bottom: 1px solid #f0f0f0;
        }
        .collection_modal-title { font-size: 17px; font-weight: bold; margin: 0; color: #000; }
        .collection_modal-cancel-btn { background: none; border: none; font-size: 16px; color: #ff0558; cursor: pointer; }
        .collection_modal-confirm-btn { background: none; border: none; font-size: 16px; color: #ff0558; cursor: pointer; }
        
        .collection_modal-body { flex: 1; overflow-y: auto; padding: 10px 0; }
        .collection-item {
            padding: 12px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer;
        }
        .collection-item:hover { background: #f9f9f9; }
        .thumb-box {
            width: 60px; height: 60px; background: #f2f2f2; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
        }
    </style>

    <div id="collection-modal" class="collection_modal-overlay">
        <div class="collection_modal-content">
            <header class="collection_modal-header">
                <button type="button" class="collection_modal-cancel-btn" onclick="closeCollectionModal()">취소</button>
                <h3 class="collection_modal-title">컬렉션에 추가</h3>
                <button type="button" class="collection_modal-confirm-btn">확인</button>
            </header>
            <div class="collection_modal-body">
                <ul id="user-collection-list" style="list-style:none; padding:0; margin:0;">
                    <li class="collection-item create-item">
    <a th:href="@{/collection/create(workId=${work.workId})}" 
       style="text-decoration: none; display: flex; align-items: center; gap: 15px; width: 100%;">
        <div class="thumb-box">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="#ccc"/>
            </svg>
        </div>
        <span style="font-size: 16px; font-weight: 500; color: #292a32;">새 컬렉션</span>
    </a>
</li>
                </ul>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /* 💡 브라우저 어디서든 접근 가능한 전역 함수 */
        window.openCollectionModal = function() {
            const modal = document.getElementById('collection-modal');
            if (modal) {
                modal.style.setProperty('display', 'flex', 'important');
                document.body.style.overflow = 'hidden'; // 스크롤 방지
            }
        };

        window.closeCollectionModal = function() {
            const modal = document.getElementById('collection-modal');
            if (modal) {
                modal.style.setProperty('display', 'none', 'important');
                document.body.style.overflow = 'auto'; // 스크롤 복구
            }
        };
    </script>
</div>
</html>
