<script th:inline="javascript">
//1. 주석 안에 넣고 뒤에 dummy 값을 적어주면 에디터가 조용해집니다.
const isLoggedIn = /*[[${#authentication.principal != 'anonymousUser'}]]*/ false;
    const wrap = document.querySelector(".rating-wrap");
    const fill = document.querySelector(".stars-fill");
    
    // 💡 경로 수정: BookDetail 내부의 Work 객체 ID
    const workId = /*[[${work.workId}]]*/ 0;

    // 1. 마우스 움직임에 따라 별 채우기 (시각적 효과)
    wrap.addEventListener("mousemove", e => {
        const percent = e.offsetX / wrap.offsetWidth;
        // 0.1 단위로 올림하여 별을 채웁니다.
        const step = Math.ceil(percent * 10) / 10; 
        fill.style.width = (step * 100) + "%";
    });

    // 2. 클릭 시 실제 서버로 데이터 전송 및 DB 저장
    wrap.addEventListener("click", e => {
        const percent = e.offsetX / wrap.offsetWidth;
        // 0.5점 단위로 계산 (percent가 0.1이면 0.5점, 0.2면 1.0점...)
        const score = Math.ceil(percent * 10) / 2;

        // 비동기 통신(Fetch API) 시작
        fetch('/api/rating/save', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                ratingScore: score,
                workId: workId
            })
        })
        .then(response => {
            if (response.ok) {
                alert(score + "점! 평가가 저장되었습니다.");
            } else if (response.status === 401) {
                alert("로그인이 필요한 서비스입니다.");
                // 필요하다면 로그인 페이지로 리다이렉트
                // location.href = '/member/login';
            } else {
                alert("저장 중 오류가 발생했습니다.");
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("서버와 통신할 수 없습니다.");
        });
    });
    
    document.querySelectorAll('.storage-btn').forEach(button => {
        button.addEventListener('click', function() {
            const workId = this.getAttribute('data-work-id');
            const status = this.getAttribute('data-status');
            const isActive = this.classList.contains('active');

            fetch('/api/storage/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ workId: workId, status: status })
            })
            .then(response => {
                if (response.ok) {
                    // 토글 로직: 클릭한 버튼이 이미 active였다면 해제, 아니면 다른거 끄고 이것만 켜기
                    if (isActive) {
                        this.classList.remove('active');
                    } else {
                        document.querySelectorAll('.storage-btn').forEach(btn => btn.classList.remove('active'));
                        this.classList.add('active');
                    }
                } else {
                    alert("로그인이 필요한 서비스입니다.");
                }
            });
        });
    });
    // 💡 더보기 드롭다운 및 모달 제어 통합 로직
    document.addEventListener("DOMContentLoaded", function() {
        const moreBtn = document.getElementById('more-btn');
        const moreMenu = document.getElementById('more-dropdown-menu');
        const addToCollectionBtn = document.getElementById('add-to-collection-btn');
        
        // 1. 더보기 드롭다운 토글
        if (moreBtn && moreMenu) {
            moreBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isVisible = moreMenu.style.display === 'block';
                moreMenu.style.display = isVisible ? 'none' : 'block';
            });
        }

        // 2. 외부 클릭 시 드롭다운 닫기
        document.addEventListener('click', (e) => {
            if (moreMenu && !moreMenu.contains(e.target) && e.target !== moreBtn) {
                moreMenu.style.display = 'none';
            }
        });

        // 3. 컬렉션 추가 클릭 시 모달 열기
        // 3. 컬렉션 추가 클릭 시 모달 열기
if (addToCollectionBtn) {
    addToCollectionBtn.addEventListener('click', () => {
        // 💡 1. 로그인 여부 확인
        if (!isLoggedIn) {
            // 페이지 이동이 아니라, 이미 th:replace로 불러온 모달을 띄웁니다.
            const loginModal = document.getElementById('login-modal'); 
            
            if (loginModal) {
                loginModal.style.display = 'flex'; // 모달 열기
                moreMenu.style.display = 'none';   // 드롭다운 닫기
            } else {
                // 만약 ID가 다르거나 모달을 못 찾을 경우를 대비한 대체 코드
                if (confirm("로그인이 필요한 서비스입니다. 로그인 하시겠습니까?")) {
                    location.href = "/login"; // 실제 로그인 페이지 주소로 이동
                }
            }
            return;
        }

        // 💡 2. 로그인 된 경우 기존 컬렉션 추가 모달 로직 실행
        const colModal = document.getElementById('collection-modal');
        if (colModal) {
            colModal.style.display = 'flex';
            moreMenu.style.display = 'none';
        }
    });
}
    });
    
 // 모달 열기: 제목과 ID를 받아서 세팅
    function openCommentModal(title, id) {
        document.getElementById('modalWorkTitle').innerText = title;
        document.getElementById('modalWorkId').value = id;
        document.getElementById('commentModal').style.display = 'flex';
        document.body.style.overflow = 'hidden'; // 배경 스크롤 방지
    }

    function closeCommentModal() {
        document.getElementById('commentModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    // 글자 수 실시간 체크 및 버튼 활성화
    const textarea = document.getElementById('commentTextarea');
    const saveBtn = document.getElementById('saveCommentBtn');
    const charCount = document.getElementById('charCount');

    textarea.addEventListener('input', function() {
        const len = this.value.length;
        charCount.innerText = `${len}/10000`;
        saveBtn.disabled = len === 0; // 내용이 없으면 버튼 비활성화
    });

    // 저장 버튼 클릭 시 서버 전송 (AJAX)
    saveBtn.addEventListener('click', function() {
        const data = {
            workId: document.getElementById('modalWorkId').value,
            content: textarea.value,
            isSpoiler: document.getElementById('spoilerCheck').checked
        };

        fetch('/api/review/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(response => {
            if(response.ok) {
                alert('코멘트가 저장되었습니다!');
                location.reload(); // 성공 시 새로고침
            } else {
                alert('저장에 실패했습니다.');
            }
        });
    });
    
    function toggleLike(commentId, btnElement) {
        // 💡 로그인 여부 확인 (이전 스크립트에서 선언한 isLoggedIn 변수 활용)
        if (!isLoggedIn) {
            alert("로그인이 필요한 서비스입니다.");
            return;
        }

        // 서버의 toggleLike API 호출
        fetch('/api/review/like', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                commentId: commentId
            })
        })
        .then(response => {
            if (!response.ok) throw new Error("네트워크 응답에 문제가 있습니다.");
            return response.json();
        })
        .then(data => {
            // 💡 1. 좋아요 숫자 업데이트 (data.newLikeCount)
            const countSpan = btnElement.querySelector('.like-count');
            if (countSpan) {
                countSpan.innerText = data.newLikeCount;
            }

            // 💡 2. 버튼 활성화 상태 표시 (data.liked 여부에 따라 클래스 토글)
            if (data.liked) {
                btnElement.classList.add('active');
                // 필요하다면 여기서 애니메이션 효과나 알림을 줄 수 있습니다.
            } else {
                btnElement.classList.remove('active');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("좋아요 처리 중 오류가 발생했습니다.");
        });
    }
</script>
</section>
</html>
